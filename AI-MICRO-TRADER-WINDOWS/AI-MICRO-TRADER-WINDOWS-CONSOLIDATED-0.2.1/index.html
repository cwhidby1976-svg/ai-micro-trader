    <script>
      // Gracefully prevent benign Vite HMR WebSocket errors from triggering unhandled rejection overlays in preview
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event &&
          event.reason &&
          (String(event.reason.message || event.reason).includes('WebSocket') ||
           String(event.reason.message || event.reason).includes('closed without opened'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation?.();
        }
      });
    </script>
